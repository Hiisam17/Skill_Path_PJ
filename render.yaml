services:
  - type: web
    name: it-career-roadmap-server
    env: node
    rootDir: .
    buildCommand: npm install && npx prisma generate --schema=apps/server/prisma/schema.prisma && npm run build --workspace=apps/server
    startCommand: npm run start:prod --workspace=apps/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false # User will set this in Render dashboard
      - key: DATABASE_URL
        sync: false # User will set this in Render dashboard
      - key: DIRECT_URL
        sync: false # User will set this in Render dashboard
