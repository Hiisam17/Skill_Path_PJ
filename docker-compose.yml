services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: skill-path-server
    ports:
      - "3000:3000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: skill-path-web
    ports:
      - "5173:5173"
    depends_on:
      - server
